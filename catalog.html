<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог API — API Library</title>
  <meta name="description" content="Полный каталог сторонних API для разработчиков: AI, финансы, карты, погода, игры и базы данных.">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header / Navbar Container -->
  <div id="navbarContainer"></div>

  <main class="catalog-page-main">
    <div class="container" style="padding-top: 40px; padding-bottom: 60px;">
      <!-- Catalog Page Header -->
      <div class="catalog-page-header text-center" style="margin-bottom: 32px;">
        <h1 class="hero-title-minimal" style="font-size: clamp(2rem, 4vw, 2.75rem); margin-bottom: 12px;">
          Каталог API
        </h1>
        <p class="hero-subtitle" style="max-width: 620px; margin: 0 auto;">
          Находите, фильтруйте и подключайте проверенные сервисы для ваших проектов и автономных агентов.
        </p>
      </div>

      <!-- Command Palette Search Bar -->
      <div class="search-bar-wrapper" style="max-width: 680px; margin: 0 auto 24px;">
        <div class="search-bar">
          <span class="search-bar-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input 
            type="text" 
            id="mainSearchInput" 
            class="search-bar-input" 
            placeholder="Поиск API: OpenAI, Stripe, Weather, Maps, Database..."
            autocomplete="off"
          >
          <kbd class="search-kbd" title="Нажмите Ctrl+K или / для быстрого фокуса">Ctrl K</kbd>
          <button id="searchClearBtn" class="search-bar-clear" title="Очистить поиск">&times;</button>
        </div>
      </div>

      <!-- Categories Filter Chips -->
      <div id="categories" class="category-chips flex-center" style="margin-bottom: 36px;">
        <!-- Rendered dynamically by JS -->
      </div>

      <!-- Catalog Controls & Filters -->
      <div class="catalog-controls">
        <div class="filters-group">
          <!-- Auth Filter -->
          <div class="filter-select-wrapper">
            <label for="authFilter">Авторизация:</label>
            <select id="authFilter" class="filter-select">
              <option value="All">Все</option>
              <option value="None">None</option>
              <option value="API Key">API Key</option>
              <option value="OAuth 2.0">OAuth 2.0</option>
              <option value="Bearer Token">Bearer Token</option>
              <option value="Basic Auth">Basic Auth</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Pricing Filter -->
          <div class="filter-select-wrapper">
            <label for="pricingFilter">Цена:</label>
            <select id="pricingFilter" class="filter-select">
              <option value="All">Все</option>
              <option value="Free">Бесплатный тариф</option>
              <option value="Freemium">Freemium</option>
              <option value="Paid">Платные</option>
            </select>
          </div>

          <!-- Format Filter -->
          <div class="filter-select-wrapper">
            <label for="formatFilter">Формат:</label>
            <select id="formatFilter" class="filter-select">
              <option value="All">Все</option>
              <option value="JSON">JSON</option>
              <option value="GraphQL">GraphQL</option>
              <option value="XML">XML</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Source Filter -->
          <div class="filter-select-wrapper">
            <label for="sourceFilter">Источник:</label>
            <select id="sourceFilter" class="filter-select">
              <option value="All">Все источники</option>
              <option value="apis.guru">APIs.guru (OpenAPI)</option>
              <option value="verified">Verified API</option>
            </select>
          </div>

          <!-- Sort By -->
          <div class="filter-select-wrapper">
            <label for="sortFilter">Сортировка:</label>
            <select id="sortFilter" class="filter-select">
              <option value="rating">По рейтингу</option>
              <option value="popularity">По популярности</option>
              <option value="createdAt">По дате добавления</option>
              <option value="name">По названию (А-Я)</option>
            </select>
          </div>
        </div>

        <div class="catalog-stats">
          <span id="catalogCount">Загрузка каталога...</span>
        </div>
      </div>

      <!-- API Cards Grid -->
      <div id="apiGrid" class="api-grid">
        <!-- Skeletons injected by JS -->
      </div>

      <!-- Pagination (Load More) -->
      <div class="pagination-wrapper">
        <button id="btnLoadMore" class="btn btn-secondary btn-lg" style="display: none;">
          Показать ещё
        </button>
      </div>
    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="footer"></footer>

  <!-- Script Initialization -->
  <script type="module">
    import { initTheme } from "./js/theme.js";
    import { renderNavbar } from "./js/components/navbar.js";
    import { initModals } from "./js/components/modal.js";
    import { toast } from "./js/components/toast.js";
    import { FilterManager, CATEGORIES } from "./js/filters.js";
    import { subscribeToApis, fetchNextPageApis } from "./js/api.js";
    import { searchApis, debounce } from "./js/search.js";
    import { createApiCardElement, createSkeletonCardElement } from "./js/components/apiCard.js";
    import { toggleFavorite } from "./js/profile.js";
    import { onAuthChange } from "./js/auth.js";

    initTheme();
    renderNavbar("catalog");
    initModals();

    const apiGrid = document.getElementById("apiGrid");
    const catalogCount = document.getElementById("catalogCount");
    const btnLoadMore = document.getElementById("btnLoadMore");
    const searchInput = document.getElementById("mainSearchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const categoriesContainer = document.getElementById("categories");

    let activeUser = null;
    let displayedApis = [];
    let currentPage = 1;
    let totalApisCount = 0;
    let categoryCounts = {};

    onAuthChange((user) => {
      activeUser = user;
    });

    async function loadCategoryCounts() {
      try {
        const res = await fetch("/api/categories");
        if (res.ok) {
          const data = await res.json();
          categoryCounts = data.counts || {};
          renderCategoryChips(filterManager.getState().category);
        }
      } catch (_) {}
    }

    function renderCategoryChips(activeCat) {
      categoriesContainer.innerHTML = CATEGORIES.map((cat) => {
        const count = categoryCounts[cat] !== undefined ? ` <span class="chip-count">${categoryCounts[cat]}</span>` : "";
        const label = cat === "All" ? "Все категории" : cat;
        return `
          <button class="category-chip ${cat === activeCat ? "active" : ""}" data-category="${cat}">
            ${label}${count}
          </button>
        `;
      }).join("");

      categoriesContainer.querySelectorAll(".category-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const selected = btn.dataset.category;
          filterManager.setCategory(selected);
          renderCategoryChips(selected);
        });
      });
    }

    function showSkeletons(count = 6) {
      apiGrid.innerHTML = "";
      for (let i = 0; i < count; i++) {
        apiGrid.appendChild(createSkeletonCardElement());
      }
    }

    function attachCardEvents(container) {
      container.querySelectorAll("[data-favorite-btn]").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const apiId = btn.dataset.favoriteBtn;
          if (!activeUser) {
            toast.warning("Пожалуйста, войдите, чтобы сохранить API в избранное");
            return;
          }
          try {
            const isFav = await toggleFavorite(apiId);
            btn.classList.toggle("active", isFav);
            btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
            btn.title = isFav ? "Удалить из избранного" : "Добавить в избранное";
            toast.success(isFav ? "Добавлено в избранное" : "Удалено из избранного");
          } catch (err) {
            toast.error("Ошибка: " + err.message);
          }
        });
      });
    }

    function renderApis(apis, append = false, total = 0) {
      if (!append) {
        apiGrid.innerHTML = "";
        displayedApis = apis;
      } else {
        displayedApis = displayedApis.concat(apis);
      }

      if (displayedApis.length === 0) {
        apiGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <h3 class="empty-state-title">Ничего не найдено</h3>
            <p class="empty-state-text">Попробуйте изменить поисковый запрос или сбросить фильтры каталога.</p>
            <button class="btn btn-secondary btn-sm" id="btnResetFilters">Сбросить все фильтры</button>
          </div>
        `;
        const resetBtn = document.getElementById("btnResetFilters");
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            filterManager.reset();
            syncFilterInputs();
            renderCategoryChips("All");
          });
        }
        catalogCount.textContent = "Найдено: 0 API";
        btnLoadMore.style.display = "none";
        return;
      }

      catalogCount.textContent = `Отображается: ${displayedApis.length} из ${total || displayedApis.length} API`;

      apis.forEach((api) => {
        const card = createApiCardElement(api, false);
        apiGrid.appendChild(card);
      });

      attachCardEvents(apiGrid);
    }

    async function fetchCatalogPage(pageNum = 1, append = false) {
      if (!append) {
        showSkeletons(6);
      }

      const state = filterManager.getState();
      const params = new URLSearchParams();
      params.set("page", pageNum);
      params.set("limit", 18);
      if (state.category && state.category !== "All") params.set("category", state.category);
      if (state.source && state.source !== "All") params.set("source", state.source);
      if (state.authentication && state.authentication !== "All") params.set("auth", state.authentication);
      if (state.pricing && state.pricing !== "All") params.set("pricing", state.pricing);
      if (state.format && state.format !== "All") params.set("format", state.format);
      if (state.sortBy) params.set("sortBy", state.sortBy);
      if (state.searchQuery && state.searchQuery.trim().length >= 2) params.set("q", state.searchQuery.trim());

      try {
        const res = await fetch(`/api/apis?${params.toString()}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        totalApisCount = data.total || 0;
        currentPage = data.page || pageNum;

        renderApis(data.apis || [], append, totalApisCount);

        if (data.hasMore) {
          btnLoadMore.style.display = "inline-flex";
          btnLoadMore.textContent = "Показать ещё";
        } else {
          btnLoadMore.style.display = "none";
        }
      } catch (err) {
        console.error("Error loading catalog:", err);
        catalogCount.textContent = "Ошибка загрузки каталога";
      }
    }

    function applyQuery() {
      currentPage = 1;
      fetchCatalogPage(1, false);
    }

    btnLoadMore.addEventListener("click", async () => {
      btnLoadMore.disabled = true;
      btnLoadMore.textContent = "Загрузка...";
      try {
        await fetchCatalogPage(currentPage + 1, true);
      } finally {
        btnLoadMore.disabled = false;
      }
    });

    loadCategoryCounts();

    const filterManager = new FilterManager(() => {
      applyQuery();
    });

    function syncFilterInputs() {
      const state = filterManager.getState();
      document.getElementById("sourceFilter").value = state.source || "All";
      document.getElementById("authFilter").value = state.authentication;
      document.getElementById("pricingFilter").value = state.pricing;
      document.getElementById("formatFilter").value = state.format;
      document.getElementById("sortFilter").value = state.sortBy;
      searchInput.value = state.searchQuery || "";
      searchClearBtn.classList.toggle("visible", Boolean(state.searchQuery));
    }

    document.getElementById("sourceFilter").addEventListener("change", (e) => filterManager.setFilter("source", e.target.value));
    document.getElementById("authFilter").addEventListener("change", (e) => filterManager.setFilter("authentication", e.target.value));
    document.getElementById("pricingFilter").addEventListener("change", (e) => filterManager.setFilter("pricing", e.target.value));
    document.getElementById("formatFilter").addEventListener("change", (e) => filterManager.setFilter("format", e.target.value));
    document.getElementById("sortFilter").addEventListener("change", (e) => filterManager.setFilter("sortBy", e.target.value));

    const debouncedSearch = debounce((query) => {
      filterManager.setSearchQuery(query);
    }, 350);

    searchInput.addEventListener("input", (e) => {
      const val = e.target.value;
      searchClearBtn.classList.toggle("visible", Boolean(val));
      debouncedSearch(val);
    });

    searchClearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchClearBtn.classList.remove("visible");
      filterManager.setSearchQuery("");
      searchInput.focus();
    });

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === "/" && document.activeElement !== searchInput && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Check URL parameters for initial category or search
    const urlParams = new URLSearchParams(window.location.search);
    const catParam = urlParams.get("category");
    const searchParam = urlParams.get("search");

    if (catParam && CATEGORIES.includes(catParam)) {
      filterManager.setCategory(catParam);
    }
    if (searchParam && searchParam !== "true") {
      filterManager.setSearchQuery(searchParam);
    } else if (searchParam === "true") {
      setTimeout(() => searchInput.focus(), 200);
    }

    renderCategoryChips(filterManager.getState().category);
    syncFilterInputs();
    applyQuery();
  </script>
</body>
</html>
