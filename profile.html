<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — API Library</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="navbarContainer"></div>

  <main class="section">
    <div class="container">
      <!-- Profile Header Card -->
      <div class="profile-header">
        <div class="flex" style="align-items: center; gap: 20px;">
          <div id="profileAvatar" class="profile-avatar-large">U</div>
          <div>
            <div class="flex" style="align-items: center; gap: 10px; margin-bottom: 4px;">
              <h1 id="profileDisplayName" style="font-size: 1.75rem;">Пользователь</h1>
              <span id="profileRole" class="badge badge-neutral">User</span>
            </div>
            <div id="profileEmail" class="text-secondary text-sm" style="margin-bottom: 6px;">user@example.com</div>
            <div class="text-muted text-xs">На сайте с: <span id="profileCreatedDate">—</span></div>
          </div>
        </div>

        <!-- Quick actions / Edit form trigger -->
        <div class="flex gap-2">
          <button id="btnOpenEditProfile" class="btn btn-secondary btn-sm">
            ⚙️ Редактировать профиль
          </button>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="tabFavorites">
          ⭐ Избранные API
        </button>
        <button class="tab-btn" data-tab="tabReviews">
          💬 Мои отзывы
        </button>
      </div>

      <!-- Tab Content: Favorites -->
      <div id="tabFavorites" class="tab-pane">
        <div id="favoritesList">
          <!-- Loaded dynamically -->
        </div>
      </div>

      <!-- Tab Content: Reviews -->
      <div id="tabReviews" class="tab-pane" style="display: none;">
        <div id="myReviewsList">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Настройки профиля</h3>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <form id="editProfileForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="editDisplayNameInput">Ваше имя / никнейм</label>
            <input type="text" id="editDisplayNameInput" class="form-control" required>
          </div>

          <div class="form-group" style="margin-top: 20px;">
            <label class="form-label">Тема оформления</label>
            <div class="flex gap-2">
              <button type="button" class="btn btn-secondary btn-sm" id="btnSetLightTheme">
                ☀ Светлая тема
              </button>
              <button type="button" class="btn btn-secondary btn-sm" id="btnSetDarkTheme">
                ☾ Темная тема
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Отмена</button>
          <button type="submit" id="btnSaveProfile" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer-content flex-center">
      <div class="text-muted text-sm">
        API Library © 2026 · Личный кабинет разработчика
      </div>
    </div>
  </footer>

  <script type="module">
    import { initTheme, setTheme } from "./js/theme.js";
    import { renderNavbar } from "./js/components/navbar.js";
    import { initModals, openModal, closeModal } from "./js/components/modal.js";
    import { toast } from "./js/components/toast.js";
    import { onAuthChange, updateUserDisplayName } from "./js/auth.js";
    import { loadProfileData } from "./js/profile.js";

    initTheme();
    renderNavbar();
    initModals();

    let activeUser = null;
    let activeProfile = null;

    onAuthChange(async (user, profile) => {
      if (!user) {
        window.location.href = "login.html?redirect=profile.html";
        return;
      }
      activeUser = user;
      activeProfile = profile;
      await loadProfileData(user, profile);
    });

    // Tab switcher
    const tabBtns = document.querySelectorAll(".tab-btn");
    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        const targetTab = btn.dataset.tab;
        document.getElementById("tabFavorites").style.display = targetTab === "tabFavorites" ? "block" : "none";
        document.getElementById("tabReviews").style.display = targetTab === "tabReviews" ? "block" : "none";
      });
    });

    // Edit profile modal trigger
    document.getElementById("btnOpenEditProfile").addEventListener("click", () => {
      openModal("editProfileModal");
    });

    // Save profile form
    document.getElementById("editProfileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newName = document.getElementById("editDisplayNameInput").value.trim();
      if (!newName) return;

      const saveBtn = document.getElementById("btnSaveProfile");
      saveBtn.disabled = true;

      try {
        await updateUserDisplayName(activeUser.uid, newName);
        toast.success("Имя успешно обновлено");
        document.getElementById("profileDisplayName").textContent = newName;
        document.getElementById("profileAvatar").textContent = newName[0].toUpperCase();
        closeModal("editProfileModal");
      } catch (err) {
        toast.error("Ошибка сохранения: " + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    // Theme triggers in modal
    document.getElementById("btnSetLightTheme").addEventListener("click", () => {
      setTheme("light");
      toast.info("Установлена светлая тема");
    });

    document.getElementById("btnSetDarkTheme").addEventListener("click", () => {
      setTheme("dark");
      toast.info("Установлена темная тема");
    });
  </script>
</body>
</html>
